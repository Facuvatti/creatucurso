<svg width="640" height="520" viewBox="0 0 640 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vista de una academia con un curso en video">
  <defs>
    <linearGradient id="g-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g-video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a78"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
    <filter id="shadow-sm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- soft cloud behind -->
  <path d="M148 330c-46 0-84-35-84-80 0-40 31-74 72-79 14-52 66-92 126-92 50 0 94 28 115 68 12-4 25-6 38-6 56 0 102 40 102 90 0 54-47 99-105 99z" fill="url(#g-cloud)"/>

  <!-- main window -->
  <g filter="url(#shadow)">
    <rect x="70" y="92" width="500" height="320" rx="24" fill="#ffffff"/>
    <rect x="70.5" y="92.5" width="499" height="319" rx="23.5" stroke="#e2e8f0"/>
  </g>
  <path d="M70 116a24 24 0 0 1 24-24h452a24 24 0 0 1 24 24v26H70z" fill="#f1f5f9"/>
  <circle cx="98" cy="117" r="6" fill="#fda4af"/>
  <circle cx="118" cy="117" r="6" fill="#fcd34d"/>
  <circle cx="138" cy="117" r="6" fill="#6ee7b7"/>
  <rect x="190" y="108" width="260" height="18" rx="9" fill="#e2e8f0"/>

  <!-- video player -->
  <rect x="94" y="164" width="302" height="200" rx="16" fill="url(#g-video)"/>
  <circle cx="245" cy="258" r="34" fill="#ffffff" fill-opacity="0.16"/>
  <circle cx="245" cy="258" r="26" fill="#ffffff"/>
  <path d="M238 244.5v27l23-13.5z" fill="#4f46e5" stroke="#4f46e5" stroke-width="4" stroke-linejoin="round"/>
  <rect x="112" y="340" width="266" height="6" rx="3" fill="#ffffff" fill-opacity="0.22"/>
  <rect x="112" y="340" width="150" height="6" rx="3" fill="url(#g-main)"/>
  <circle cx="262" cy="343" r="7" fill="#ffffff"/>

  <!-- lesson list -->
  <rect x="416" y="164" width="130" height="14" rx="7" fill="#c7d2fe"/>
  <g>
    <rect x="416" y="196" width="130" height="44" rx="12" fill="#eef2ff"/>
    <circle cx="436" cy="218" r="9" fill="url(#g-green)"/>
    <path d="M431.5 218l3 3 5-6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="452" y="212" width="80" height="8" rx="4" fill="#a5b4fc"/>
    <rect x="452" y="225" width="52" height="6" rx="3" fill="#c7d2fe"/>
  </g>
  <g>
    <rect x="416" y="250" width="130" height="44" rx="12" fill="#eef2ff"/>
    <circle cx="436" cy="272" r="9" fill="url(#g-main)"/>
    <path d="M433.5 268.5v7l6-3.5z" fill="#fff"/>
    <rect x="452" y="266" width="76" height="8" rx="4" fill="#a5b4fc"/>
    <rect x="452" y="279" width="48" height="6" rx="3" fill="#c7d2fe"/>
  </g>
  <g>
    <rect x="416" y="304" width="130" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="436" cy="326" r="9" fill="#e2e8f0"/>
    <rect x="452" y="320" width="70" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="452" y="333" width="44" height="6" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- graduation cap -->
  <g filter="url(#shadow-sm)">
    <path d="M520 62l78 32-78 32-78-32z" fill="url(#g-main)"/>
    <path d="M480 112v28c0 10 18 20 40 20s40-10 40-20v-28l-40 16z" fill="#4338ca"/>
    <path d="M520 62l78 32-78 32-78-32z" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M594 98v34" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="594" cy="140" r="7" fill="#f97316"/>
  </g>

  <!-- payment chip -->
  <g filter="url(#shadow-sm)">
    <rect x="430" y="352" width="170" height="74" rx="20" fill="#ffffff"/>
    <rect x="430.5" y="352.5" width="169" height="73" rx="19.5" stroke="#e2e8f0"/>
  </g>
  <circle cx="470" cy="389" r="22" fill="url(#g-green)"/>
  <path d="M470 376v26M477 382.5c-2-2-4.600-2.800-7-2.800-4 0-7 1.800-7 4.800 0 7 14 3.400 14 10 0 3-3 5-7 5-3 0-5.800-1.200-7.600-3.200" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <rect x="504" y="373" width="74" height="9" rx="4.500" fill="#0f172a" fill-opacity="0.82"/>
  <rect x="504" y="391" width="48" height="7" rx="3.500" fill="#94a3b8"/>

  <!-- certificate card -->
  <g filter="url(#shadow-sm)">
    <rect x="34" y="338" width="188" height="110" rx="20" fill="#ffffff"/>
    <rect x="34.500" y="338.500" width="187" height="109" rx="19.500" stroke="#e2e8f0"/>
  </g>
  <rect x="54" y="360" width="96" height="10" rx="5" fill="#0f172a" fill-opacity="0.82"/>
  <rect x="54" y="380" width="120" height="7" rx="3.500" fill="#cbd5e1"/>
  <rect x="54" y="394" width="88" height="7" rx="3.500" fill="#e2e8f0"/>
  <circle cx="182" cy="418" r="22" fill="url(#g-orange)"/>
  <circle cx="182" cy="418" r="14" stroke="#fff" stroke-opacity="0.9" stroke-width="3"/>
  <path d="M174 436l-4 16 12-6 12 6-4-16" fill="#f97316"/>
  <path d="M176 418l4 4 8-9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="418" width="64" height="8" rx="4" fill="#c7d2fe"/>

  <!-- sparkles -->
  <path d="M40 150l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#38bdf8" fill-opacity="0.9"/>
  <path d="M600 262l3.500 9 9 3.500-9 3.500-3.500 9-3.500-9-9-3.500 9-3.500z" fill="#a78bfa"/>
  <circle cx="58" cy="64" r="7" fill="#fbbf24"/>
  <circle cx="610" cy="468" r="9" fill="#34d399" fill-opacity="0.85"/>
</svg>
