# Media node: serves the encrypted HLS segments and proxies tus uploads to tusd.
# Mounted by compose.yaml as /etc/nginx/templates/default.conf.template, so the
# nginx image replaces ${PLATFORM_DOMAIN} and ${MEDIA_SECRET} when it starts.
# Design and trade-offs: docs/adr/0020-media-serving.md.

# CORS: subdomains of the platform by pattern, plus the verified custom domains
# that the encoder writes to /media/allowed-origins.map (one `"origin" "origin";` per line).
map $http_origin $cors_origin {
	default "";
	~^https?://[a-z0-9-]+\.${PLATFORM_DOMAIN}(:[0-9]+)?$ $http_origin;
	include /media/allowed-origins*.map;
}

map $http_x_forwarded_proto $forwarded_proto {
	default $scheme;
	https https;
}

server {
	listen 80;
	server_name _;

	# /hls/<signature>/<expires>/<videoId>/<segment>.ts
	# The signature is md5("<expires>/<videoId> <MEDIA_SECRET>") in base64url and
	# covers every file of the video until it expires. The app computes it when it
	# rewrites the playlist (src/areas/media/playback.ts).
	location ~ ^/hls/(?<sig>[A-Za-z0-9_-]+)/(?<exp>[0-9]+)/(?<vid>[0-9a-f-]{36})/(?<file>[A-Za-z0-9_-]+\.ts)$ {
		secure_link $sig,$exp;
		secure_link_md5 "$exp/$vid ${MEDIA_SECRET}";
		if ($secure_link = "") { return 403; }
		if ($secure_link = "0") { return 410; }

		add_header Access-Control-Allow-Origin $cors_origin always;
		add_header Vary Origin always;
		add_header Cache-Control "private, max-age=3600";
		default_type video/mp2t;
		alias /media/hls/$vid/$file;
	}

	# tus uploads. CORS is answered here (tusd runs with -disable-cors) so one
	# rule decides which sites may call the media node.
	location /files/ {
		if ($request_method = OPTIONS) {
			add_header Access-Control-Allow-Origin $cors_origin always;
			add_header Vary Origin always;
			add_header Access-Control-Allow-Methods "POST, GET, HEAD, PATCH, DELETE, OPTIONS" always;
			add_header Access-Control-Allow-Headers "Authorization, Content-Type, Tus-Resumable, Upload-Length, Upload-Offset, Upload-Metadata, Upload-Defer-Length, Upload-Concat, X-HTTP-Method-Override, X-Requested-With" always;
			add_header Access-Control-Max-Age 86400 always;
			return 204;
		}
		add_header Access-Control-Allow-Origin $cors_origin always;
		add_header Vary Origin always;
		add_header Access-Control-Expose-Headers "Upload-Offset, Location, Upload-Length, Tus-Version, Tus-Resumable, Tus-Max-Size, Tus-Extension, Upload-Metadata, Upload-Defer-Length, Upload-Concat" always;

		client_max_body_size 0;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_http_version 1.1;
		proxy_read_timeout 600s;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header X-Forwarded-Proto $forwarded_proto;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_pass http://tusd:8080;
	}
}
