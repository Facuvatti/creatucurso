# Media node for the Basic video tier: tusd (resumable uploads), nginx (signed
# segments) and the encoder. Run it next to the app, passing the app's
# environment file to compose with --env-file:
#   docker compose --env-file <your env file> -f infra/media/compose.yaml up -d
# MEDIA_ROOT is the one directory shared by tusd, nginx, the encoder and the app:
#   uploads/<videoId>    originals (tusd writes them)
#   hls/<videoId>/       encrypted HLS (the encoder writes it, nginx and the app read it)
#   allowed-origins.map  CORS list for custom domains (the encoder writes it)
# The app runs on the host or in its own compose file; tusd reaches its hook at
# APP_URL_FOR_HOOKS (default http://host.docker.internal:4310).
services:
  tusd:
    image: tusproject/tusd:latest # multi-arch, arm64 checked (ADR-0019)
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDIA_ROOT:-./media-data}/uploads:/srv/tusd-data
    command:
      - -upload-dir=/srv/tusd-data
      - -base-path=/files/
      - -behind-proxy
      - -disable-cors
      - -max-size=${MEDIA_MAX_BYTES:-2147483648}
      - -hooks-enabled-events=pre-create,post-finish
      - -hooks-http=${APP_URL_FOR_HOOKS:-http://host.docker.internal:4310}/api/media/tus-hook?secret=${MEDIA_HOOK_SECRET:?set MEDIA_HOOK_SECRET}
      - -hooks-http-forward-headers=Authorization

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - tusd
    ports:
      - "${MEDIA_PORT:-8088}:80"
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
      MEDIA_SECRET: ${MEDIA_SECRET:?set MEDIA_SECRET}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${MEDIA_ROOT:-./media-data}:/media:ro

  # Custom domains verified after nginx started appear in allowed-origins.map;
  # nginx reads it on reload. Shares nginx's process namespace to send SIGHUP.
  nginx-reload:
    image: busybox
    restart: unless-stopped
    pid: "service:nginx"
    command: sh -c 'while sleep 300; do kill -HUP 1; done'

  encoder:
    # Node runs the TypeScript entry directly (Node 22.18+); ffmpeg comes from apt.
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    # Needs the app code and node_modules: mount the checkout read-only.
    volumes:
      - ../..:/app:ro
      - ${MEDIA_ROOT:-./media-data}:/media-data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      MEDIA_ROOT: /media-data
      MEDIA_MAX_SECONDS: ${MEDIA_MAX_SECONDS:-3600}
      MEDIA_ENCODER_PORT: ${MEDIA_ENCODER_PORT:-4312}
      PUBLIC_URL_SCHEME: ${PUBLIC_URL_SCHEME:-https}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
    command: sh -c "apt-get update -qq && apt-get install -y -qq ffmpeg && node src/media/encoder.ts"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.MEDIA_ENCODER_PORT||4312)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 120s
